name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev-*
      - release-*
    tags:
      - v*
  pull_request:

env:
  PRE_RELEASE: ${{ github.ref == 'refs/heads/main' && 'development' || '' }}
  GOLANGCI-LINT_VER: "2.14.0"
  GORELEASER_VER: "2.18.2"
  SYFT_VER: "1.13.0"


jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - 
        uses: actions/checkout@v7
      -
        name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      -
        name: Setup syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v${{ env.SYFT_VER }}
      -
        name: Setup gotestsum
        run: |
          make install-gotestsum
      -
        name: Build
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          version: v${{ env.GORELEASER_VER }}
          args: build --clean --snapshot --single-target
      -
        name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ env.GOLANGCI-LINT_VER }}
          args: --timeout=30m
      -
        name: Test
        run: |
          .ext/bin/gotestsum --format short-verbose -- -count=1 -parallel=1 -v -timeout=240s -coverprofile=cover.out -coverpkg=./... ./...
      -
        name: Upload code coverage
        uses: shogo82148/actions-goveralls@v1
        continue-on-error: true
        with:
          path-to-profile: cover.out
    
  push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    if: github.event_name == 'push' && ( github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') )

    steps:
      - 
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      -
        name: Setup syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v${{ env.SYFT_VER }}
      -
        name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - 
        name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}          
      -
        name: Push image to GitHub Container Registry
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          version: v${{ env.GORELEASER_VER }}
          args: release --clean --snapshot

  release:
    needs: [test, push]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

      # Only release when ref is a tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - 
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      -
        name: Setup syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v${{ env.SYFT_VER }}
      -
        name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - 
        name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - 
        name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}          
      - 
        name: Release
        if: github.event_name == 'push'  && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          DOCKER_CLI_EXPERIMENTAL: "enabled"
        with:
          distribution: goreleaser
          version: v${{ env.GORELEASER_VER }}
          args: release --clean
